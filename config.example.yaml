version: 2
participants:
  debate-openai:
    description: Neutral debate participant from OpenAI
    model: openai/gpt-6-astra
    variant: high
  debate-glm:
    description: Neutral debate participant from Z.ai
    model: commandcode/zai-org/GLM-5.3
    variant: max
  debate-kimi:
    description: Neutral debate participant from Moonshot AI
    model: commandcode/moonshotai/Kimi-K3
    variant: max
  debate-anthropic:
    description: Neutral debate participant from Anthropic
    model: openrouter/anthropic/claude-opus-5
    variant: high
  debate-qwen:
    description: Neutral debate participant from Alibaba
    model: commandcode/Qwen/Qwen3.8-Max-0902
    variant: xhigh
sets:
  default:
    default: yes
    continuation: ask
    participants:
      - debate-kimi
      - debate-anthropic
      - debate-openai
  cheap:
    continuation: ask
    participants:
      - debate-glm
      - debate-qwen
      - debate-openai
# Optional automatic-debate settings. Omit set to use the configured default set.
auto_debate:
  enabled: true
  set: cheap
  max_rounds: 3
  persist_transcripts: true
# Optional mini-debate defaults. Omit participant to use the default set's first member.
mini_debate:
  participant: debate-glm
  max_rounds: 5
